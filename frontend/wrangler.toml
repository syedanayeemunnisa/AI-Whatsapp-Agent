name = ai-whatsapp-agent-dashboard
compatibility_date = 2026-09-01
pages_build_output_dir = dist

# The dashboard is a static SPA. It talks to the local backend through the
# Cloudflare Tunnel hostname — set VITE_API_BASE at build time, e.g.:
#   VITE_API_BASE=https://api-yourname.trycloudflare.com npm run build
# Leave empty for local dev (Vite proxies /api to localhost:4000).
[vars]
# VITE_API_BASE = ""
